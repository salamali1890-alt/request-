<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KML Viewer + Subscription Request (Fiber X — Mobile + Google Form)</title>

  <!-- Leaflet من jsDelivr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#101833;
      --text:#e9eefb;
      --muted:#aab4d6;
      --accent:#7aa2ff;
      --danger:#ff6b6b;
      --ok:#22c55e;
    }
    *{box-sizing:border-box}

    html, body{
      height:100%;
      width:100%;
      margin:0;
      padding:0;
    }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      font-size:14px;
    }

    header{
      padding:10px 12px;
      background:rgba(255,255,255,0.03);
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      position:relative;
      z-index:999;
    }
    h1{
      margin:0;
      font-size:16px;
      font-weight:700;
      flex:1 1 100%;
    }
    .controls{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      width:100%;
    }
    .panel{
      background:var(--panel);
      padding:8px 10px;
      border-radius:14px;
      box-shadow:0 6px 20px rgba(0,0,0,.25);
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      width:100%;
    }
    input[type=file]{
      color:var(--muted);
      max-width:100%;
      font-size:12px;
    }
    button{
      background:var(--accent);
      color:#0b1020;
      border:0;
      border-radius:10px;
      padding:8px 10px;
      font-weight:600;
      cursor:pointer;
      font-size:13px;
      min-height:34px;
      flex:1 1 auto;
    }
    button.secondary{background:#394375;color:#e9eefb}
    button.ok{background:var(--ok);color:#000}
    button.danger{background:var(--danger);color:#000}

    #map{
      height:calc(100vh - 84px);
      width:100vw;
    }

    .legend{
      position:absolute;
      bottom:10px;
      inset-inline-end:10px;
      background:var(--panel);
      color:var(--text);
      padding:8px 10px;
      border-radius:10px;
      font-size:12px;
      line-height:1.4;
      box-shadow:0 6px 20px rgba(0,0,0,.25);
      z-index:998;
      max-width:70vw;
    }
    .pill{
      display:inline-block;
      padding:2px 6px;
      border-radius:999px;
      background:#223067;
      color:#cfe0ff;
      font-size:11px;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:5000;
    }
    .modal.show{display:flex}

    .card{
      width:100%;
      max-width:900px;
      background:#0f1631;
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px 18px 0 0;
      box-shadow:0 -10px 30px rgba(0,0,0,.6);
      max-height:92vh;
      display:flex;
      flex-direction:column;
    }
    .card header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 14px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:transparent;
    }
    .card header h2{
      margin:0;
      font-size:16px;
    }
    .badge{
      display:inline-block;
      background:#1c275e;
      padding:2px 6px;
      border-radius:999px;
      font-size:11px;
      color:#cfe0ff;
      margin-inline-start:6px;
    }

    .card .body{
      padding:12px 14px 14px;
      overflow-y:auto;
    }

    .grid{
      display:grid;
      gap:10px;
      grid-template-columns:1fr 1fr;
    }
    label{
      font-size:12px;
      color:var(--muted);
      display:block;
      margin-bottom:4px;
    }
    input, select, textarea{
      width:100%;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:#0c1430;
      color:#fff;
      font-size:13px;
    }
    textarea{
      resize:vertical;
      min-height:70px;
    }
    input[readonly]{opacity:.85}

    .row{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:6px;
    }
    .left{margin-inline-start:auto}
    .hint{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
    }
    .success{color:#86efac}
    .error{color:#ff9191}
    .mono{
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:11px;
      direction:ltr;
      text-align:left;
      white-space:pre-wrap;
      word-break:break-all;
      margin-top:6px;
    }

    /* Toast */
    .toast{
      position:fixed;
      bottom:16px;
      inset-inline:0;
      margin:auto;
      width:max-content;
      max-width:90vw;
      background:#16a34a;
      color:#fff;
      padding:8px 16px;
      border-radius:999px;
      font-size:13px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.45);
      opacity:0;
      transform:translateY(20px);
      pointer-events:none;
      transition:opacity .3s ease, transform .3s ease;
      z-index:6000;
    }
    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    /* شاشة موبايل: الفورم بكولمن واحد وبكامل الشاشة */
    @media (max-width: 768px){
      header{
        padding:8px 10px;
      }
      #map{
        height:calc(100vh - 92px);
      }
      .panel{
        padding:8px;
      }
      .panel button{
        flex:1 1 48%;
      }
      .modal{
        align-items:stretch;
      }
      .card{
        max-width:100%;
        max-height:100vh;
        height:100vh;
        border-radius:0;
      }
      .card header{
        position:sticky;
        top:0;
        background:#0f1631;
        z-index:10;
      }
      .card .body{
        padding:10px 10px 14px;
      }
      .grid{
        grid-template-columns:1fr;
      }
      input, select, textarea{
        font-size:14px;
      }
    }

    /* أزرار أصغر على اللابتوب */
    @media (min-width: 900px){
      .panel button{
        flex:0 0 auto;
        width:140px;
      }
      .panel input[type=file]{
        width:260px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>عارض KML — Basra / Fiber X</h1>
    <div class="controls">
      <div class="panel">
        <label style="font-size:12px;"><b>ارفع KML</b>:</label>
        <input id="file" type="file" accept=".kml,.kmz" />
        <button id="btnFit" disabled>تركيز</button>
        <button id="btnExport" disabled>GeoJSON</button>
        <button id="btnLocate">موقعي</button>
        <button id="btnForm" class="ok">طلب اشتراك</button>
      </div>
    </div>
  </header>

  <div id="map"></div>
  <div class="legend">
    <div><b>تعليمات</b></div>
    <div>• ارفع <code>.kml</code> لعرض المناطق</div>
    <div>• انقر على أي منطقة لملء اسمها و FAT/FDT</div>
    <div>• اضغط <b>موقعي</b> ثم <span class="pill">موقعي الآن</span> داخل الفورم لتعبئة الإحداثيات</div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">تم تسجيل الطلب</div>

  <!-- Modal Form -->
  <div class="modal" id="modal">
    <div class="card">
      <header>
        <h2>طلب اشتراك جديد <span class="badge" id="stamp"></span></h2>
        <button id="btnClose" class="danger">إغلاق</button>
      </header>
      <div class="body">
        <div class="grid">
          <div>
            <label>اسم الزبون</label>
            <input id="custName" placeholder="الاسم الثلاثي" />
          </div>
          <div>
            <label>رقم الهاتف</label>
            <input id="phone" placeholder="07xxxxxxxxx" inputmode="numeric" />
          </div>
          <div>
            <label>اسم المندوب</label>
            <input id="agentName" placeholder="اسم المندوب" />
          </div>
          <div>
            <label>تصنيف المشترك</label>
            <select id="subscriberType">
              <option value="">— اختر —</option>
              <option>سكني</option>
              <option>تجاري</option>
              <option>عمارة</option>
              <option>مطعم</option>
              <option>شركة</option>
              <option>شقق</option>
              <option>مستشفى</option>
              <option>دائرة حكومية</option>
            </select>
          </div>
          <div>
            <label>نوع الاشتراك المحتمل</label>
            <select id="plan">
              <option value="">— اختر —</option>
              <option>p1</option><option>p2</option><option>p3</option>
              <option>p4</option><option>p5</option><option>p6</option>
            </select>
          </div>
          <div>
            <label>الخدمة الحالية</label>
            <select id="currentService">
              <option value="">— اختر —</option>
              <option value="EarthLink">ايرث لنك</option>
              <option value="Towers">ابراج</option>
              <option value="Other">اخرى</option>
            </select>
          </div>
          <div>
            <label>تاريخ انتهاء الاشتراك الحالي</label>
            <input id="expiration" type="date" />
          </div>
          <div>
            <label>الموقع الحالي (Lat / Lng)</label>
            <div class="row">
              <input id="lat" placeholder="Latitude" />
              <input id="lng" placeholder="Longitude" />
              <button id="btnUseMyLoc" class="secondary">موقعي الآن</button>
            </div>
          </div>
          <div>
            <label>اسم المنطقة (من KML)</label>
            <input id="regionName" placeholder="— يتم تعبئته عند النقر على المنطقة —" readonly />
          </div>
          <div>
            <label>FDT</label>
            <input id="fdt" placeholder="N127 مثلاً" />
          </div>
          <div>
            <label>FAT</label>
            <input id="fat" placeholder="F18 مثلاً" />
          </div>
          <div style="grid-column:1/3;">
            <label>ملاحظات</label>
            <textarea id="notes" placeholder="أي تفاصيل إضافية عن المشترك أو الموقع..."></textarea>
          </div>
        </div>

        <div class="row" style="margin-top:10px">
          <button id="btnSaveCSV">CSV</button>
          <button id="btnSaveXLSX">Excel</button>
          <button id="btnCopyJSON">JSON</button>
          <button id="btnSend" class="ok">إرسال</button>
        </div>
        <div class="hint" id="status"></div>
        <div class="mono" id="raw"></div>
      </div>
    </div>
  </div>

  <!-- JS libs من jsDelivr -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.0/dist/togeojson.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    if (typeof L === 'undefined') {
      alert('تعذر تحميل مكتبة الخريطة Leaflet. تأكد من اتصال الإنترنت وعدم حجب موقع jsDelivr من مزود الخدمة لديك.');
    }

    const map = L.map('map', {zoomControl:true}).setView([30.50, 47.80], 10);
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '&copy; OpenStreetMap' }).addTo(map);
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, attribution: 'Tiles &copy; Esri' });
    L.control.layers({ "OpenStreetMap": osm, "Esri Satellite": esriSat }).addTo(map);

    window.addEventListener('load', () => {
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    });

    // ====== KML handling ======
    let geoLayer = null;
    let lastGeoJSON = null;

    function featureStyle(f){
      return {
        color: f.properties && f.properties.stroke || '#7aa2ff',
        weight:2,
        opacity:.9,
        fillColor: f.properties && f.properties.fill || '#7aa2ff',
        fillOpacity:.15
      };
    }

    function parseFdtFatFromName(name) {
      if (!name) return { fdt: '', fat: '' };

      if (name.includes('/')) {
        const parts = name.split('/').map(s => s.trim()).filter(Boolean);
        const fat = (parts[0] || '').toUpperCase();
        const fdt = (parts[1] || '').toUpperCase();
        return { fat, fdt };
      }

      const tokens = name.split(/[\s\-_]+/).map(t => t.trim()).filter(Boolean);
      let fat = '';
      let fdt = '';

      for (const tRaw of tokens) {
        const t = tRaw.toUpperCase();
        if (!fat && /^F\d+$/i.test(t)) fat = t;
        if (!fdt && /^N\d+$/i.test(t)) fdt = t;
      }

      return { fat, fdt };
    }

    function onEachFeature(feature, layer){
      const p = feature.properties || {};
      const name = p.name || p.Name || 'Unnamed';
      const desc = p.description || p.Description || '';
      let html = '<b>' + name + '</b>';
      if (desc) html += '<br/><div style="max-width:320px;white-space:pre-wrap">' + desc + '</div>';
      layer.bindPopup(html);
      layer.on('click', () => {
        document.getElementById('regionName').value = name;
        const parsed = parseFdtFatFromName(name);
        if (parsed.fdt) document.getElementById('fdt').value = parsed.fdt;
        if (parsed.fat) document.getElementById('fat').value = parsed.fat;
      });
    }

    function fitToLayer(layer){
      try{
        map.fitBounds(layer.getBounds(), {padding:[30,30]});
      }catch(e){}
    }

    const input = document.getElementById('file');
    const btnFit = document.getElementById('btnFit');
    const btnExport = document.getElementById('btnExport');

    input.addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const ext = (file.name.split('.').pop()||'').toLowerCase();
      if(ext!=='kml'){
        alert('الرجاء رفع ملف KML (امتداد .kml).');
        return;
      }
      const text = await file.text();
      const dom = new DOMParser().parseFromString(text, 'text/xml');
      const gj = toGeoJSON.kml(dom);
      lastGeoJSON = gj;
      if (geoLayer) {
        map.removeLayer(geoLayer);
        geoLayer = null;
      }
      geoLayer = L.geoJSON(gj, {style: featureStyle, onEachFeature}).addTo(map);
      fitToLayer(geoLayer);
      btnFit.disabled = false;
      btnExport.disabled = false;
    });

    btnFit.addEventListener('click', ()=>{ if(geoLayer) fitToLayer(geoLayer); });
    btnExport.addEventListener('click', ()=>{
      if(!lastGeoJSON) return;
      const blob = new Blob([JSON.stringify(lastGeoJSON, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kml_converted.geojson';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // ===== My location (blue dot) =====
    let myMarker = null, lastLatLng = null, geoWatchId = null;

    function updateMyLocation(lat, lng){
      lastLatLng = [lat, lng];
      if (myMarker){
        myMarker.setLatLng([lat,lng]);
      } else {
        myMarker = L.circleMarker([lat,lng], {
          radius:6,
          color:'#3b82f6',
          fillColor:'#3b82f6',
          fillOpacity:1,
          weight:2
        }).addTo(map);
      }
    }

    function showAccuracyStatus(pos){
      const accuracy = pos.coords.accuracy;
      const statusNode = document.getElementById('status');
      if (!statusNode || !accuracy) return;
      if (accuracy > 1000){
        statusNode.textContent = '⚠ الموقع تقريبي (غالبًا مبني على IP). يفضل تفعيل GPS أو استخدام الموبايل/Wi-Fi.';
      } else if (accuracy <= 100){
        statusNode.textContent = '✅ تم الحصول على موقع بدقة عالية (GPS أو Wi-Fi).';
      } else {
        statusNode.textContent = 'ℹ تم الحصول على موقع تقريبي.';
      }
    }

    function startGeolocation(){
      if(!('geolocation' in navigator)){
        alert('المتصفح لا يدعم تحديد الموقع.');
        return;
      }

      if (location.protocol !== 'https:' && location.hostname !== 'localhost'){
        alert('⚠ للحصول على موقع دقيق يفضل فتح الصفحة عبر HTTPS أو من localhost. من وضع file:// قد يستخدم المتصفح موقع IP فقط أو يمنع تحديد الموقع.');
      }

      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          updateMyLocation(pos.coords.latitude, pos.coords.longitude);
          map.setView([pos.coords.latitude, pos.coords.longitude], 16);
          showAccuracyStatus(pos);

          if (geoWatchId === null){
            geoWatchId = navigator.geolocation.watchPosition(
              (p)=>{
                updateMyLocation(p.coords.latitude, p.coords.longitude);
                showAccuracyStatus(p);
              },
              (err)=>{
                console.error(err);
              },
              {
                enableHighAccuracy:true,
                maximumAge:0,
                timeout:20000
              }
            );
          }
        },
        (err)=>{
          alert('تعذر الحصول على موقع دقيق: ' + err.message);
        },
        {
          enableHighAccuracy:true,
          maximumAge:0,
          timeout:20000
        }
      );
    }

    document.getElementById('btnLocate').addEventListener('click', startGeolocation);

    // ===== Modal / Form =====
    const modal = document.getElementById('modal');
    const btnForm = document.getElementById('btnForm');
    const btnClose = document.getElementById('btnClose');
    const btnUseMyLoc = document.getElementById('btnUseMyLoc');
    const statusNode = document.getElementById('status');
    const rawNode = document.getElementById('raw');
    const stamp = document.getElementById('stamp');
    const toast = document.getElementById('toast');

    function nowStamp(){
      const d=new Date();
      const p=n=>String(n).padStart(2,'0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
             ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function openForm(){
      stamp.textContent = nowStamp();
      modal.classList.add('show');
    }

    function closeForm(){
      modal.classList.remove('show');
    }

    function showToast(msg){
      if(!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(()=> toast.classList.remove('show'), 3000);
    }

    btnForm.addEventListener('click', openForm);
    btnClose.addEventListener('click', closeForm);

    btnUseMyLoc.addEventListener('click', ()=>{
      if(!lastLatLng){
        statusNode.textContent='⚠ أولًا اضغط "موقعي" ثم أعد المحاولة.';
        return;
      }
      const la = lastLatLng[0];
      const ln = lastLatLng[1];
      document.getElementById('lat').value = la.toFixed(6);
      document.getElementById('lng').value = ln.toFixed(6);
      statusNode.textContent = '✅ تم تعبئة الإحداثيات.';
    });

    function getFormData(){
      const lat = document.getElementById('lat').value.trim();
      const lng = document.getElementById('lng').value.trim();
      const locationCombined = lat && lng ? (lat + ' , ' + lng) : '';
      return {
        timestamp: nowStamp(),
        customer_name: document.getElementById('custName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        agent_name: document.getElementById('agentName').value.trim(),
        subscriber_type: document.getElementById('subscriberType').value,
        potential_plan: document.getElementById('plan').value,
        current_service: document.getElementById('currentService').value,
        current_expiration: document.getElementById('expiration').value,
        lat: lat,
        lng: lng,
        location: locationCombined,
        region_name: document.getElementById('regionName').value.trim(),
        fdt: document.getElementById('fdt').value.trim(),
        fat: document.getElementById('fat').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };
    }

    function validate(d){
      if(!d.customer_name) return 'الاسم مطلوب';
      if(!/^(07)\d{9}$/.test(d.phone)) return 'صيغة الهاتف يجب أن تكون 07xxxxxxxxx';
      if(!d.location) return 'الرجاء تعبئة الإحداثيات (استخدم "موقعي الآن")';
      if(!d.potential_plan) return 'الرجاء اختيار نوع الاشتراك المحتمل';
      if(!d.current_service) return 'الرجاء اختيار الخدمة الحالية';
      return '';
    }

    function resetFormFields(){
      const fields = modal.querySelectorAll('input, select, textarea');
      fields.forEach(el => {
        if (el.type === 'button') return;
        if (el.tagName === 'SELECT') {
          el.selectedIndex = 0;
        } else {
          el.value = '';
        }
      });
      if (stamp) stamp.textContent = '';
      if (statusNode) statusNode.textContent = '';
      if (rawNode) rawNode.textContent = '';
    }

    function exportCSV(){
      const d = getFormData();
      const err = validate(d);
      if(err){
        statusNode.textContent='⚠ '+err;
        return;
      }
      const headers = [
        'timestamp','customer_name','phone','agent_name','subscriber_type',
        'potential_plan','current_service','current_expiration',
        'location','region_name','fdt','fat','notes'
      ];
      const row = headers.map(h=> (d[h]||'').toString().replace(/"/g,'""'));
      const csv = headers.join(',') + '\n' + row.map(v=>'"'+v+'"').join(',');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = 'subscription_request.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      statusNode.textContent='✅ تم تنزيل CSV';
    }

    function exportXLSX(){
      const d = getFormData();
      const err = validate(d);
      if(err){
        statusNode.textContent='⚠ '+err;
        return;
      }
      const wb = XLSX.utils.book_new();
      const exportRow = [{
        timestamp: d.timestamp,
        customer_name: d.customer_name,
        phone: d.phone,
        agent_name: d.agent_name,
        subscriber_type: d.subscriber_type,
        potential_plan: d.potential_plan,
        current_service: d.current_service,
        current_expiration: d.current_expiration,
        location: d.location,
        region_name: d.region_name,
        fdt: d.fdt,
        fat: d.fat,
        notes: d.notes
      }];
      const ws = XLSX.utils.json_to_sheet(exportRow, {
        header: [
          'timestamp','customer_name','phone','agent_name','subscriber_type',
          'potential_plan','current_service','current_expiration',
          'location','region_name','fdt','fat','notes'
        ]
      });
      XLSX.utils.book_append_sheet(wb, ws, 'Request');
      XLSX.writeFile(wb, 'subscription_request.xlsx');
      statusNode.textContent='✅ تم تنزيل Excel';
    }

    async function sendToSheet() {
      const d = getFormData();           
      const err = validate(d);          
      if (err) {
        statusNode.textContent = '⚠ ' + err;
        return;
      }

      const GOOGLE_FORM_ACTION =
        "https://docs.google.com/forms/d/e/1FAIpQLScO07-blpyIj-QXmO_YMlkXsPp0XLu1DX7b5w8fkrZr_3nKZw/formResponse";

      const formData = new FormData();

      formData.append("entry.1420111373", d.customer_name);        // اسم الزبون
      formData.append("entry.74569537",   d.phone);                // رقم الهاتف
      formData.append("entry.474411513",  d.agent_name);           // اسم المندوب
      formData.append("entry.2083245545", d.subscriber_type);      // تصنيف المشترك
      formData.append("entry.2077133893", d.potential_plan);       // نوع الاشتراك المحتمل
      formData.append("entry.1811893489", d.current_service);      // الخدمة الحالية
      formData.append("entry.532115684",  d.current_expiration);   // تاريخ انتهاء الاشتراك الحالي
      formData.append("entry.207739107",  d.location);             // الموقع (Lat / Lng)
      formData.append("entry.423805587",  d.region_name);          // اسم المنطقة KML
      formData.append("entry.1873409724", d.fdt);                  // FDT
      formData.append("entry.1658688861", d.fat);                  // FAT
      formData.append("entry.967242283",  d.notes);                // ملاحظات

      try {
        statusNode.textContent = '⏳ يتم الإرسال إلى Google Form...';
        rawNode.textContent = '';

        await fetch(GOOGLE_FORM_ACTION, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        resetFormFields();
        closeForm();
        showToast('تم تسجيل الطلب ✅');

      } catch (e) {
        statusNode.textContent = '❌ فشل الإرسال: ' + (e.message || e);
      }
    }

    document.getElementById('btnSaveCSV').addEventListener('click', exportCSV);
    document.getElementById('btnSaveXLSX').addEventListener('click', exportXLSX);
    document.getElementById('btnCopyJSON').addEventListener('click', ()=>{
      const d = getFormData();
      const err = validate(d);
      if(err){
        statusNode.textContent='⚠ '+err;
        return;
      }
      const text = JSON.stringify(d, null, 2);
      navigator.clipboard.writeText(text).then(()=>{
        statusNode.textContent='✅ تم نسخ JSON';
      }).catch(()=>{
        statusNode.textContent='⚠ تعذر النسخ التلقائي — انسخ يدويًا';
        console.log(text);
      });
    });
    document.getElementById('btnSend').addEventListener('click', sendToSheet);
  </script>
</body>
</html>
